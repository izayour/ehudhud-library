<title>أرض الشموس الصغيرة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Baloo+Bhaijaan+2:wght@400;500;600;700&display=swap">
<style>
/* Layout: one landscape picture-book spread on a sunset-orange stage — illustration page on the left, text page on the right, page controls beneath. */
:root{
  --stage:#F1D9B5;          /* warm late-afternoon sand */
  --stage-ink:#5A3416;      /* controls on the stage */
  --paper:#FBF6EA;          /* the book page itself (same in both themes) */
  --ink:#33302A;            /* story text */
  --ink-soft:#66604F;       /* author line, captions */
  --leaf:#C2580F;           /* the little sun (orange) */
  --spine:rgba(51,48,42,.18);
  --btn:#FBF6EA;
  --btn-ink:#33302A;
  --display:'Lalezar','Baloo Bhaijaan 2',Tahoma,sans-serif;
  --text:'Baloo Bhaijaan 2',Tahoma,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:#24170C; --stage-ink:#EDD3B3; --btn:#3A2614; --btn-ink:#F1E9D6; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --stage:#24170C; --stage-ink:#EDD3B3; --btn:#3A2614; --btn-ink:#F1E9D6; color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--stage);color:var(--stage-ink);font-family:var(--text);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
.book{
  width:min(1200px,100%,calc((100vh - 120px) * 1.6));
  width:min(1200px,100%,calc((100dvh - 120px) * 1.6));
  aspect-ratio:16/10;max-width:100%;
  display:grid;grid-template-columns:46.6% 1fr;grid-template-rows:minmax(0,1fr);
  direction:ltr;                        /* picture on the left, text page on the right */
  background:var(--paper);border-radius:6px 14px 14px 6px;
  box-shadow:0 1px 0 rgba(0,0,0,.04),0 18px 40px -18px rgba(70,35,10,.45),0 2px 6px rgba(70,35,10,.12);
  overflow:hidden;position:relative;
  touch-action:pan-y;
}
.text-page{
  direction:rtl;min-width:0;min-height:0;overflow:hidden;position:relative;
  display:flex;flex-direction:column;justify-content:center;
  padding:clamp(20px,6%,72px);
  background:
    radial-gradient(120% 90% at 30% 20%,rgba(255,255,255,.55),transparent 60%),
    var(--paper);
  color:var(--ink);
}
.pic-page{position:relative;min-width:0;background:#F3E4CC;order:-1}
.pic-page img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(100% 80% at 50% 40%,#F4EEDC,#F1D9B5);color:var(--leaf);direction:rtl;text-align:center;padding:24px}
.ph svg{width:clamp(40px,6vw,76px);height:auto;opacity:.7}
.ph p{margin:0;font-size:clamp(.95rem,1.5vw,1.25rem);color:var(--ink-soft)}
.pic-page::before{ /* the spine shadow where the pages meet */
  content:"";position:absolute;inset:0 0 0 auto;width:28px;z-index:1;
  background:linear-gradient(270deg,var(--spine),transparent);
  pointer-events:none;
}
.fade{transition:opacity .35s ease}
.turning .fade{opacity:0}

/* cover */
.cover{display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(10px,2.2vw,24px)}
.cover .kicker{margin:0;font-size:clamp(.95rem,1.6vw,1.3rem);color:var(--ink-soft);letter-spacing:.02em}
.cover h1{
  font-family:var(--display);font-weight:400;margin:0;line-height:1.05;
  font-size:clamp(2.8rem,8vw,6.8rem);color:var(--leaf);
  text-shadow:0 2px 0 rgba(255,255,255,.7);
  text-wrap:balance;
}
.ornament{display:flex;align-items:center;gap:12px;color:var(--leaf)}
.ornament span{display:block;width:clamp(36px,6vw,80px);height:2px;background:currentColor;opacity:.45;border-radius:2px}
.ornament svg{width:clamp(22px,2.6vw,32px);height:auto}
.author{margin:0;font-size:clamp(1.05rem,2.1vw,1.7rem);color:var(--ink-soft);font-weight:500}
.author b{color:var(--ink);font-weight:700}

/* story pages */
.story{flex:none;display:flex;flex-direction:column;gap:.55em;font-size:clamp(1rem,1.8vw,1.6rem)}
.story p{margin:0;font-size:1em;line-height:1.75;font-weight:500;text-wrap:pretty}
.story h2.sec{font-family:var(--display);font-weight:400;font-size:1.6em;line-height:1.2;margin:0 0 .2em;color:var(--leaf)}
.story p.lesson{font-weight:700;color:var(--leaf)}
.story p.dlg{padding-inline-start:1.1em;text-indent:-1.1em}
.verse{margin:.2em 0;padding:.5em 1em;border-inline-start:3px solid var(--leaf);background:rgba(194,88,15,.07);border-radius:4px 10px 10px 4px}
.verse p{font-weight:600;color:var(--leaf);line-height:1.7}
.folio{position:absolute;bottom:clamp(10px,2.5%,22px);inset-inline:0;text-align:center;font-size:clamp(.85rem,1.3vw,1.05rem);color:var(--ink-soft)}

/* controls */
.controls{display:flex;align-items:center;gap:20px;direction:ltr}
.controls button{
  font:inherit;font-weight:600;font-size:1.05rem;
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 20px;border-radius:999px;border:0;cursor:pointer;
  background:var(--btn);color:var(--btn-ink);
  box-shadow:0 2px 6px rgba(70,35,10,.18);
  transition:transform .15s ease,opacity .15s ease;
}
.controls button:hover:not(:disabled){transform:translateY(-1px)}
.controls button:focus-visible{outline:3px solid var(--leaf);outline-offset:3px}
.controls button:disabled{opacity:.35;cursor:default}
.count{min-width:6.5em;text-align:center;font-size:1rem;font-variant-numeric:tabular-nums}

@media (max-width:640px), (orientation:portrait) and (max-width:900px){
  .book{display:flex;flex-direction:column;aspect-ratio:auto;width:100%;border-radius:12px}
  .pic-page{height:min(56vh,120vw)}
  .pic-page::before{display:none}
  .text-page{padding:28px 22px 44px}
}
@media (prefers-reduced-motion:reduce){.fade,.controls button{transition:none}}
</style>

<main class="book" id="book" aria-live="polite">
  <section class="text-page"><div class="fade" id="text"></div><p class="folio" id="folio"></p></section>
  <figure class="pic-page" style="margin:0"><img class="fade" id="pic" alt="" hidden><div class="ph fade" id="ph" hidden></div></figure>
</main>

<nav class="controls" aria-label="التنقل بين الصفحات">
  <button id="next" type="button" aria-label="الصفحة التالية">‹ التالي</button>
  <span class="count" id="count" dir="rtl"></span>
  <button id="prev" type="button" aria-label="الصفحة السابقة">السابق ›</button>
</nav>

    {"img": "images/j17.jpg", "text": ["سار أيامًا بمحاذاة الفرات، حتى التقى قافلة من التجار كانت في طريقها إلى دمشق. رحب به التجار وسمحوا له بمرافقتهم، وكان أصغر المسافرين سنًا وأكثرهم فضولًا. لم يترك تاجرًا إلا وسأله عما يحمل، حتى ضاق به بعضهم، بينما تسلى آخرون بأسئلته الكثيرة.", "ولما وصل إلى دمشق، لم يصدق عينيه. كانت الأسواق تعج بالناس والدواب، والدكاكين تعرض من البضائع ما لم ير مثله في حياته. رأى الأقمشة الملونة والعطور والأواني اللامعة، ولكنه كان يبحث عن شيء آخر."]},
    {"img": "images/j18.jpg", "text": ["وفي سوق الفاكهة، وقف مدهوشًا أمام أكوام من الثمار المختلفة. كانت هناك حبات خضراء وحمراء وصفراء، بعضها مستدير وبعضها طويل، وبعضها أكبر من رأسه.", "توقف أمام بائع يعرض الرمان، وسأله:", "– ما هذه الكرات الحمراء؟", "– إنها الرمان يا صغيري، ألا تعرفه؟", "– وهل هي لذيذة؟", "– جرب واحكم بنفسك.", "شق البائع رمانة وأعطاه بعض حباتها. وضعها سمير في فمه، فانفجرت عصارتها الحلوة بين أسنانه.", "– يا للعجب! إنها ألذ من الفراولة!"]},
    {"img": "images/n19b.jpg", "text": ["ضحك البائع وقال:", "– وما الفراولة؟", "فأخبره سمير عن الحبات الحمراء التي تباع في قريته، وعن ثمنها الباهظ.", "ضحك البائع مرة أخرى وقال:", "– لو بعت الرمان بهذا الثمن لما اشتراه مني أحد. انظر حولك، كل هؤلاء يبيعون الرمان!", "نظر سمير إلى الدكاكين المجاورة، فوجد بالفعل أكوامًا من الرمان عند أكثر من بائع.", "اشترى رمانتين، ووضعهما في جعبته، وخرج من السوق مسرورًا."]},
    {"img": "images/j19.jpg", "text": ["ولكن فرحته لم تدم طويلًا.", "ففي اليوم التالي، وبينما كان يتأمل الرمانتين، لاحظ أن إحداهما قد تشققت وبدأت تفسد. تذوق بعض حباتها، ثم رمى ما تبقى منها.", "أما الثانية فأكلها وهو يفكر كيف سيحمل مثلها إلى قريته البعيدة.", "ولما انتهى منها لم يبق في يده إلا القشرة وبعض البذور.", "نظر إلى البذور قليلًا، ثم نفض يده منها ومضى."]},
    {"img": "images/j20.jpg", "text": ["بعد أيام انضم سمير إلى قافلة أخرى متجهة شمالًا نحو بلاد الأناضول.", "هناك رأى جبالًا عالية لم ير مثلها من قبل، ووديانًا خضراء تجري فيها المياه، وأشجارًا لا تشبه نخيل قريته.", "وفي إحدى القرى، توقف ليستريح عند بيت فلاح عجوز كان يعمل في بستانه.", "رحب به الرجل، وقدم له خبزًا وجبنًا وطبقًا من الفاكهة.", "أكل سمير حتى شبع، ثم خرج يتجول في البستان.", "كانت الأشجار مثقلة بالثمار، وبعض أغصانها تكاد تلامس الأرض."]},
    {"img": "images/n22.jpg", "text": ["اقترب من شجرة تحمل ثمارًا كبيرة، ومد يده ليقطف واحدة، فسمع صوت الفلاح يناديه:", "– مهلك يا بني! تلك لم تنضج بعد.", "سحب سمير يده بسرعة، فسأله الرجل:", "– أتحب الفاكهة إلى هذا الحد؟", "– أحبها، ولكنني أبحث عن فاكهة لم ير أهل قريتي مثلها.", "– ولماذا؟", "– لأن رجلًا جاء إلى قريتنا يبيع حبات حمراء صغيرة بثمن غالٍ، وقد أفسدت تلك الحبات أحوال الناس.", "ضحك الفلاح وقال:", "– وهل أفسدت الحبات أحوال الناس، أم الناس أفسدوا أحوالهم من أجل الحبات؟", "لم يعرف سمير بماذا يجيب."]},
    {"img": "images/n22.jpg", "text": ["ثم سأله:", "– هل تبيعني بعض ثمارك؟", "– أبيعك ما تشاء، ولكن أين قريتك؟", "– على ضفة الفرات.", "رفع الفلاح حاجبيه وقال:", "– الفرات! إنها رحلة طويلة. ستفسد الثمار قبل أن تصل.", "تنهد سمير، فقد حدث ذلك بالفعل مع رمان دمشق."]},
    {"img": "images/n24.jpg", "text": ["وبينما كان يفكر، رأى حفيد الفلاح الصغير يجلس قرب شجرة ويحفر حفرة في التراب.", "اقترب منه وسأله:", "– ماذا تفعل؟", "– أزرع شجرة.", "نظر سمير إلى الحفرة، فلم ير فيها شجرة.", "– وأين الشجرة؟", "فتح الصغير كفه وأراه بذرة.", "ضحك سمير وقال:", "– هذه ليست شجرة!", "فرد الصغير بثقة:", "– ليست شجرة بعد!"]},
    {"img": "images/n24.jpg", "text": ["جاء الجد يحمل قربة ماء، وساعد حفيده على دفن البذرة وسقيها.", "وفي اليوم التالي، رأى سمير الصغير يعود إلى المكان نفسه، فيحفر التراب بأصبعه ليرى إن كانت الشجرة قد خرجت.", "صاح به جده من بعيد:", "– اتركها يا مشاغب! لن تنمو أسرع لأنك تنظر إليها!", "ضحك سمير، وضحك الصغير، ثم أعاد التراب إلى مكانه."]},
    {"img": "images/j21.jpg", "text": ["وقبل أن يغادر سمير، أعطاه الفلاح كيسًا صغيرًا فيه بذور من أشجار البستان.", "– خذ هذه معك، فقد تنجح زراعتها في بلادكم.", "شكره سمير ووضع الكيس في جعبته.", "ولكنه لم يبتعد كثيرًا حتى عاد يسأل:", "– وهل تحب هذه الأشجار الحر؟", "هز الفلاح رأسه وقال:", "– بعضها لا يحتمل حر الصيف عندكم، وبعضها يحتاج إلى برد الشتاء. جرب، فلعل شيئًا منها ينجح.", "حك سمير رأسه، ثم شكره مرة أخرى ومضى."]},
    {"img": "images/n27.jpg", "text": ["تنقل سمير بعد ذلك بين البلدان، وكلما وصل إلى مدينة دخل أسواقها وسأل عن الفاكهة وأشجارها.", "رأى العنب والتين والتفاح، ورأى ثمارًا غريبة لم يعرف أسماءها.", "وفي أحد الأسواق، اشترى ثمرة صفراء جميلة، فلما قضمها وجدها شديدة الحموضة حتى انكمش وجهه وأغمض عينيه.", "ضحك الأطفال الذين كانوا حوله، وضحك معهم.", "وفي سوق آخر اشترى ثمرة كبيرة، فلما فتحها وجدها مليئة بالبذور وقليلة اللب، فاضطر إلى بصق البذور واحدة بعد أخرى، حتى صاح به البائع:", "– يا فتى! لقد اشتريت ثمرة لا مدفعًا يقذف الحصى!"]},
    {"img": "images/j24.jpg", "text": ["وكان كلما رأى ثمرة أعجبته، سأل عن الشجرة التي تحملها، وعن البلاد التي تنمو فيها.", "ومرت الأيام والأسابيع، ونفد ما معه من زاد، فصار يساعد التجار في تحميل بضائعهم مقابل الطعام والمبيت.", "وفي إحدى الليالي، جلس قرب نار القافلة يتناول عشاءه. كان العشاء خبزًا يابسًا وبعض التمر.", "أخرج تمرة من جعبته، وتأملها قبل أن يأكلها.", "تذكر نخيل قريته، وتذكر إخوته، وتذكر الليلة التي كاد فيها أن يفقد حياته بين الذئاب.", "كم اشتاق إلى بيته!", "كان قد مضى وقت طويل منذ غادر، ولم يجد بعد ما يبحث عنه."]},
    {"img": "images/j25.jpg", "text": ["وفي تلك الليلة، سمع تاجرًا يتحدث عن بلاد بعيدة في الغرب، فيها أشجار خضراء طوال السنة، تحمل ثمارًا مستديرة بلون الشمس عند الغروب.", "رفع سمير رأسه وسأل:", "– وهل هي لذيذة؟", "– لذيذة جدًا.", "– وهل هي غالية؟", "– لا أعرف، ولكن أهل تلك البلاد يزرعونها في بساتينهم.", "– وأين هذه البلاد؟", "– في أقصى الغرب، في بلاد البرتغال.", "ظل سمير يفكر في تلك الثمار حتى غلبه النوم.", "وفي الصباح، كان أول من استيقظ في القافلة."]},
    {"img": "images/j26.jpg", "text": ["لم تكن الطريق إلى البرتغال سهلة. عبر سمير الجبال والسهول، ورافق قوافل كثيرة، وتعلم كلمات من لغات لم يكن يعرفها.", "وكان كلما سأل عن البرتغال، أشار له الناس نحو الغرب.", "حتى جاء يوم وصل فيه إلى قرية صغيرة تحيط بها بساتين خضراء.", "كان الوقت قريبًا من الغروب، وكانت الشمس تلون السماء بالبرتقالي والأحمر.", "وبينما كان يسير على حصانه، لمح شيئًا غريبًا بين الأشجار.", "توقف، وحدق طويلًا.", "كانت هناك كرات مستديرة صفراء تميل إلى الاحمرار، تتدلى من الأغصان الخضراء.", "بدت له كأن عشرات الشموس الصغيرة قد اختبأت بين الأوراق.", "نزل عن حصانه واقترب من إحدى الأشجار.", "مد يده نحو ثمرة، لكنه سمع صوتًا من خلفه:"]},
    {"img": "images/n31.jpg", "text": ["– مهلك يا فتى! هل اعتدت أن تقطف ثمار الناس دون أن تستأذن؟", "التفت سمير مذعورًا، فرأى رجلًا يحمل سلة كبيرة.", "اعتذر منه، وقال:", "– سامحني يا سيدي، ولكنني لم أر في حياتي مثل هذه الثمار!", "نظر الرجل إليه مستغربًا، ثم ابتسم وقطف ثمرة ناضجة وقدمها له.", "– تفضل، تذوقها.", "أخذها سمير وأدارها بين يديه. كانت أكبر من الفراولة بكثير، وقشرتها ملساء ذات رائحة عطرة."]},
    {"img": "images/j27.jpg", "text": ["حاول أن يقضمها كما يقضم التفاح، فضحك الرجل وقال:", "– تمهل! عليك أن تقشرها أولًا.", "أخذ الثمرة منه، وشق قشرتها بسكين صغيرة، ثم فصلها إلى قطع وقدم له إحداها.", "وضع سمير القطعة في فمه.", "كانت حلوة، كثيرة العصير، وفيها حموضة خفيفة جعلته يرغب في قطعة أخرى.", "أكل الثانية، ثم الثالثة، حتى لم يبق من الثمرة شيء."]},
    {"img": "images/j28.jpg", "text": ["قال الرجل ضاحكًا:", "– يبدو أنها أعجبتك!", "– إنها عجيبة! وما اسمها؟", "أخبره الرجل باسمها بلغته، فحاول سمير أن يردده، ولكنه تعثر في لفظه.", "ضحك الرجل، وضحك سمير معه.", "ثم سأله سمير:", "– وهل تنمو هذه الأشجار هنا طوال السنة؟", "– الأشجار تبقى خضراء، أما الثمار فلها موسمها.", "– وهل تحب الشمس؟", "– كثيرًا، ولكنها تحب الماء أيضًا."]},
    {"img": "images/j28.jpg", "text": ["– وهل يمكن أن تنمو على ضفة الفرات؟", "فكر الرجل قليلًا وقال:", "– ربما، إن اعتنيتم بها وحميتموها من الحر الشديد.", "اتسعت عينا سمير.", "– وهل أستطيع أن أزرعها من البذور؟", "– تستطيع، ولكن عليك أن تصبر سنوات، وقد تختلف ثمارها عن هذه. أما إذا أردت ثمارًا مثلها، فتعلم كيف تطعم الأشجار."]},
    {"img": "images/n35.jpg", "text": ["لم يفهم سمير ما معنى تطعيم الأشجار، فسأل الرجل عنه.", "أخذه الرجل إلى طرف البستان، وأراه شجرة صغيرة ربط على أحد أغصانها غصنًا من شجرة أخرى.", "قال:", "– انظر، بعد أن يلتئم الغصنان، ينمو هذا الغصن ويعطي ثمار الشجرة التي أخذناه منها.", "ظل سمير يتأمل الغصن المربوط، ثم قال:", "– وهل أستطيع أن أتعلم ذلك؟", "– إن كنت صبورًا.", "فبقي سمير أيامًا في البستان، يساعد الرجل في عمله ويتعلم منه زراعة الأشجار والعناية بها."]},
    {"img": "images/j29.jpg", "text": ["وفي أحد الأيام، وجد صاحب البستان سميرًا يجمع البذور من الثمار التي أكلها.", "سأله:", "– ماذا ستفعل بكل هذه البذور؟", "– سأزرعها في قريتي.", "– كلها؟", "– لا، سأعطي كل بيت بعضًا منها."]},
    {"img": "images/j29.jpg", "text": ["استغرب الرجل وسأله:", "– ألا تريد أن تزرعها لنفسك وتبيع ثمارها؟", "نظر إليه سمير وقال:", "– لو فعلت ذلك، فماذا تغير في قريتنا؟", "لم يفهم الرجل قصده، فحكى له سمير عن الفراولة والرجل الأبيض، وعن إخوته الذين ناموا جائعين بسببه.", "استمع الرجل إليه باهتمام، ثم قال:", "– يبدو أنك قطعت طريقًا طويلة من أجل ثمرة!", "– بل من أجل قرية كاملة."]},
    {"img": "images/j30.jpg", "text": ["أعجب الرجل بجوابه، فأعطاه كيسًا من البذور وبعض الغراس الصغيرة، وساعده على وضعها في أوعية يستطيع حملها معه.", "وقبل أن يغادر، ملأ جعبته بالثمار، ثم قال له:", "– اعتنِ بالغراس جيدًا في الطريق، ولا تنس أن تسقيها.", "شكره سمير، وودعه، ثم امتطى حصانه متجهًا نحو الشرق.", "كانت رحلة العودة أصعب مما توقع.", "فقد كان عليه أن يحافظ على الثمار من الفساد، وعلى الغراس من الجفاف، وأن يجد لها الماء كل يوم.", "وكان كلما توقفت القافلة ليستريح المسافرون، أسرع سمير إلى غراسه يتفقد أوراقها ويسقي ترابها."]},
    {"img": "images/j31.jpg", "text": ["وفي إحدى الليالي هبت عاصفة قوية، فتطايرت الأمتعة، وانقلب أحد الأوعية التي تحمل الغراس.", "ولما هدأت الريح، وجد سمير إحدى نبتاته الصغيرة ملقاة على الأرض، وقد انكشفت جذورها.", "جلس قربها، وجمع التراب بيديه، ثم أعاد غرسها بعناية.", "مر به أحد التجار فرآه يعمل في الظلام، فقال:", "– اتركها يا فتى، إنها مجرد نبتة صغيرة!", "فرد سمير وهو يثبت التراب حولها:", "– ولكنها قطعت معي كل هذه الطريق!", "ضحك التاجر ومضى.", "أما سمير فظل يعمل حتى اطمأن إلى نبتته، ثم حملها ووضعها قربه لينام."]},
    {"img": "images/s16.jpg", "text": ["ومضت الأيام، وبدأت بعض الثمار تفسد، فكان سمير يستخرج بذورها ويحتفظ بها. وذبلت بعض الغراس، ولكنه استطاع أن ينقذ أكثرها.", "وكان كلما اقترب من الفرات ازداد شوقه إلى قريته.", "حتى جاء يوم رأى فيه من بعيد صفوف النخيل التي يعرفها.", "عرف عندها أنه اقترب من بيته.", "أسرع بحصانه، وقلبه يخفق فرحًا.", "لقد غاب مئة يوم، وها هو يعود أخيرًا.", "ولما بدا من بعيد، تجمع أبناء البلدة على مدخلها بانتظاره، متلهفين ليعرفوا ما في جعبته.", "وكانت جعبته ملأى."]},
    { img: "images/s17.jpg", text: [
      "“هل وفيت بعهدك وأحضرت لنا الحل؟” صرخ أحد المنتظرين. ابتسم سمير وقال لهم: “تجمّعوا، تجمّعوا”، ثم صعد على سقف بيت وخاطبهم:",
      "– لقد همت في البلدان طويلاً ورأيت الغرائب والعجائب. زرت الشام والأناضول، ثم همت في البلاد حتى أخذتني قدماي إلى بلاد البرتغال، وقد وجدت لكم هناك ما سيدهش عيونكم. لقد جئتكم بطعام ستنسون من بعده الفراولة.",
      "– “أرنا ما عندك”، صاح به المجتمعون بلهفة."
    ] },
    { img: "images/s18.jpg", text: [
      "بكل فخر وحبور فتح سمير جعبته وأخرج منها كرة بحجم يده، ذات لون أصفر يميل إلى الاحمرار، ورفعها أمامه ليراها الناس.",
      "ارتفعت أصوات الإعجاب والتساؤلات بين المحتشدين، ونادى أحد الحاضرين: “إنها كالشمس الصغيرة!”. بالفعل كان شكلها الدائري ولونها يشبهان الشمس قبل المغيب. ونادى آخر:",
      "– هل هذا اللون الجميل قشرة خارجية كما الفراولة؟",
      "فلم يرد سمير، بل حمل سكينه وقطع كرته في منتصفها، ليبرز داخل الثمرة أجمل من قشرتها. وارتفعت الأصوات بالتسبيح والحمد لله."
    ] },
    { img: "images/s19.jpg", text: [
      "ونادى ثالث:",
      "– ما اسم هذه الثمرة؟",
      "فردّ سمير: “لا اسم لها عندنا، ولكن سأسميها برتغالة لأنها أتت من بلاد البرتغال”.",
      "ونادى رابع:",
      "– وماذا بعد أن تنتهي تلك الحبات التي أحضرتها؟",
      "وكان هذا هو السؤال الذي ينتظره سمير، فقال:",
      "– أحبّتي، في كل ثمرة عدة بذور. والآن، بعدما أوزّع قطعها عليكم، يأخذ كل بيت بذرة واحدة ويزرعها ويرويها. لقد أتيت بهذه الثمرة من بلاد دافئة، وستحب تلك البذور بلادنا وستستوطنها."
    ] },
    { img: "images/s20.jpg", text: [
      "وبالفعل وزّع سمير قطع البرتغال، أو البرتقال كما أصبح اسمها لاحقاً، على كل بيت في قريته. ولم تمضِ أيام حتى خرجت البراعم من البذار، ففرح أهل القرية فرحاً كبيراً بمولودهم الجديد.",
      "وأصبحت أخبار تلك النبتة الجديدة أجمل أحاديثهم، يتحدثون بها مثلما يتحدث الأهل عن أول أولادهم وهو يكبر بين أيديهم لحظة بلحظة."
    ] },
    { img: "images/s21.jpg", text: [
      "وبعد مرور سنة أورقت تلك الشجيرات الصغيرة بورقات خضراء داكنة لم يرَ مثلها أهل الصحراء.",
      "ثم بعدها أزهرت زهوراً بيضاء ذات رائحة خلابة ساحرة تكاد تُسكر الذين يشمّونها. ولشدة ما أحبّوا رائحتها احتفظوا بها بعدما قطّروها بالماء الذي سُمّي ماء الزهر.",
      "ثم تحوّلت الزهرة إلى كرة خضراء صغيرة، ثم كبرت الكرة وكبرت مع الأيام إلى أن توشّحت بالصفار، وصارت لذيذة طعماً ولوناً."
    ] },
    { img: "images/s22.jpg", text: [
      "ولم تمر سنين قليلة حتى تحوّلت دار بني سعد إلى واحة خضراء، جلبت إليها أهل البلاد المجاورة ليتفرّجوا عليها وعلى الشموس الصغيرة التي تنبت بين أغصانها.",
      "أما الرجل الأبيض فكسدت تجارته وغادر قرية بني سعد، ولكن يُقال إنه سيعود وفي جعبته أشياء أخرى."
    ] }
  ]
};

const $ = id => document.getElementById(id);
const ar = n => n.toLocaleString("ar-EG");
const bird = `<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="18" r="10" fill="currentColor"/><path d="M16 8c0-3 2-5 5-5-1 3-3 4-5 5z" fill="#4F7A2E"/><path d="M16 8c-1-2-3-3-5-3" stroke="#4F7A2E" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="12.5" cy="15" r="1.6" fill="#FBF6EA" opacity=".55"/></svg>`;

let i = 0;
try { const h = parseInt((location.hash.match(/^#page-(\d+)$/) || [])[1], 10); if (h >= 1 && h <= BOOK.pages.length) i = h - 1; } catch (e) {}

function para(t){
  if (typeof t === "object" && t.lesson) return `<p class="lesson">${t.lesson}</p>`;
  if (typeof t === "object" && t.verse) return `<div class="verse">${t.verse.map(l => `<p>${l}</p>`).join("")}</div>`;
  return `<p${t.startsWith("–") ? ' class="dlg"' : ""}>${t}</p>`;
}

function render(){
  const p = BOOK.pages[i];
  let html;
  if (p.type === "cover") {
    html = `<div class="cover">${BOOK.kicker ? `<p class="kicker">${BOOK.kicker}</p>` : ""}<h1>${BOOK.title}</h1><div class="ornament"><span></span>${bird}<span></span></div><p class="author">${BOOK.credit} <b>${BOOK.author}</b></p></div>`;
    $("folio").textContent = "";
  } else {
    html = `<div class="story">${p.title ? `<h2 class="sec">${p.title}</h2>` : ""}${(p.text || []).map(para).join("")}</div>`;
    $("folio").textContent = ar(i);
  }
  $("text").innerHTML = html;
  if (p.img) {
    $("pic").hidden = false; $("ph").hidden = true;
    $("pic").src = p.img; $("pic").alt = p.alt || ""; $("pic").style.objectPosition = p.pos || "";
  } else {
    $("pic").hidden = true; $("ph").hidden = false;
    $("ph").innerHTML = `${bird}<p>رسم هذه الصفحة قادم</p>`;
  }
  $("count").textContent = i === 0 ? "الغلاف" : `صفحة ${ar(i)} من ${ar(BOOK.pages.length - 1)}`;
  $("prev").disabled = i === 0;
  $("next").disabled = i === BOOK.pages.length - 1;
  const next = BOOK.pages[i + 1]; if (next && next.img) { const im = new Image(); im.src = next.img; }
  fit(); setTimeout(fit, 250);
}

// Long pages: shrink the story text until it fits the page (landscape layout only).
const stacked = matchMedia("(max-width:640px), (orientation:portrait) and (max-width:900px)");
function fit(){
  const story = document.querySelector(".story");
  if (!story) return;
  story.style.fontSize = "";
  if (stacked.matches) return;
  const page = story.closest(".text-page"), cs = getComputedStyle(page);
  const avail = page.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 44;
  let fs = parseFloat(getComputedStyle(story).fontSize);
  while (story.scrollHeight > avail && fs > 11) { fs -= 0.5; story.style.fontSize = fs + "px"; }
}
addEventListener("resize", fit);
addEventListener("load", fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
if (document.fonts) { document.fonts.addEventListener("loadingdone", fit); document.fonts.addEventListener("loadingerror", fit); }
setTimeout(fit, 1500); setTimeout(fit, 4000);

function go(d){
  const n = i + d; if (n < 0 || n >= BOOK.pages.length) return;
  const book = $("book");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { i = n; render(); setHash(); return; }
  book.classList.add("turning");
  setTimeout(() => { i = n; render(); setHash(); requestAnimationFrame(() => book.classList.remove("turning")); }, 350);
}
function setHash(){ try { history.replaceState(null, "", i ? `#page-${i + 1}` : location.pathname + location.search); } catch (e) {} }

$("next").onclick = () => go(1);
$("prev").onclick = () => go(-1);
// Arabic books turn right to left: the left arrow moves forward.
addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); go(1); }
  if (e.key === "ArrowRight" || e.key === "PageUp") { e.preventDefault(); go(-1); }
});
let sx = null, sy = null;
$("book").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
$("book").addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx > 0 ? 1 : -1);
  sx = sy = null;
}, { passive: true });
addEventListener("hashchange", () => { const h = parseInt((location.hash.match(/^#page-(\d+)$/) || [])[1], 10); if (h >= 1 && h <= BOOK.pages.length && h - 1 !== i) { i = h - 1; render(); } });
render();
</script>
